<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#5142a5" />
    <link rel="icon" href="/icons/persona.svg" type="image/svg+xml" />
    <title>Sem conexão · Persona</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6f3;
        color: #252139;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.04em;
      }
      p {
        line-height: 1.6;
        color: #655e72;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 18px;
        background: #5142a5;
        color: white;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid #252139;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>Vamos reconectar?</h1>
      <p>O Persona precisa de internet para conversar e gerar respostas. Confira sua conexão e tente novamente.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
